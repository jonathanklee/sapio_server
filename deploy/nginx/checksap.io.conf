# checksap.io - website and API. This is the live configuration.
#
# access_log is off everywhere on purpose: the project promises that visitor
# IPs never reach a log file. Do not add logging back without changing that
# promise in the README first.

# ── HTTP → HTTPS redirects ────────────────────────────────────────────────────
server {
    access_log off;
    listen 80;
    server_name checksap.io www.checksap.io server.checksap.io;

    location /.well-known/acme-challenge/ {
        root /var/www/sapio-website;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── checksap.io — main website ────────────────────────────────────────────────
server {
    access_log off;
    listen 443 ssl;
    server_name checksap.io www.checksap.io;

    root /var/www/sapio-website;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/checksap.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checksap.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ =404;
    }

    # Pre-rendered per-app pages, falling back to the dynamic page.
    location /app/ {
        try_files $uri/index.html $uri/ /app.html;
    }
}

# ── server.checksap.io — API (Strapi) ─────────────────────────────────────────
server {
    access_log off;
    listen 443 ssl;
    server_name server.checksap.io;

    ssl_certificate /etc/letsencrypt/live/server.checksap.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.checksap.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Block AI bots
    if ($http_user_agent ~* (Amazonbot|anthropic-ai|Applebot-Extended|AwarioRssBot|AwarioSmartBot|Bytespider|CCBot|ChatGPT-User|Claude-Web|ClaudeBot|cohere-ai|DataForSeoBot|Diffbot|FacebookBot|Google-Extended|GPTBot|ImagesiftBot|magpie-crawler|omgili|Omgilibot|peer39_crawler|PerplexityBot|YouBot)) {
        return 403;
    }

    # Strapi's admin panel and admin APIs - LAN only.
    #
    # Strapi 4.3.2 predates the fixes for CVE-2023-22621 and CVE-2023-22894;
    # a publicly reachable panel is what turns those into a full takeover
    # chain. The app and the website only ever call /api/, so closing this
    # costs them nothing. Note /uploads/ (the icons) is deliberately not
    # matched here - only /upload, Strapi's admin upload API.
    location ~ ^/(admin|content-manager|content-type-builder|i18n|upload|users-permissions|email)(/|$) {
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://strapi;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }

    location /fdroid/ {
        alias /var/www/fdroid/;
        autoindex off;
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://strapi;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection Upgrade;
        proxy_pass_request_headers on;
    }
}
