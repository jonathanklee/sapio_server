# LEGACY - sapio.ovh, www.sapio.ovh, website.sapio.ovh
#
# The project moved to checksap.io in July 2026. These hosts only ever served
# GETs, so a 301 is safe here - unlike server.sapio.ovh, which still proxies
# because old app versions POST to it (see strapi.conf).
#
# Keep sapio.ovh: search engines still index it and shared links point at it,
# so the redirect is what carries that traffic and its ranking over.
#
# One certificate covers all three names:
#   certbot certonly --cert-name sapio.ovh --webroot -w /var/www/sapio-website \
#       -d sapio.ovh -d www.sapio.ovh -d website.sapio.ovh

server {
    access_log off;
    listen 80;
    server_name sapio.ovh www.sapio.ovh website.sapio.ovh;

    location /.well-known/acme-challenge/ {
        root /var/www/sapio-website;
    }

    location / {
        return 301 https://checksap.io$request_uri;
    }
}

server {
    access_log off;
    listen 443 ssl;
    server_name sapio.ovh www.sapio.ovh website.sapio.ovh;

    ssl_certificate /etc/letsencrypt/live/sapio.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sapio.ovh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://checksap.io$request_uri;
}
