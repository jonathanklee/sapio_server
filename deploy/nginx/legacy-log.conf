# Usage counter for the legacy API host (server.sapio.ovh).
#
# Deliberately records no IP, user-agent or referer - only enough to know
# whether app versions <= v2.6.2 are still calling in, so the host can be
# retired once this stops moving. See deploy/nginx/strapi.conf.
log_format legacy_count '$time_iso8601 $request_method $uri $status';
