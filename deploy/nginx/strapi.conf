# LEGACY - server.sapio.ovh
#
# The project moved to checksap.io in July 2026 (Android app from v2.6.3,
# released 2026-07-13). Anyone still on v2.6.2 or older calls this host, so it
# keeps proxying to Strapi rather than redirecting: those clients POST their
# evaluations, and a 301 would be replayed as a GET and silently drop them.
#
# Retire this file once v2.6.2 and older are gone from the wild. The apex and
# website legacy hosts redirect instead, since they only ever serve GETs.

server {
    access_log off;
    listen 80;
    server_name server.sapio.ovh;

    location /.well-known/acme-challenge/ {
        root /var/www/sapio-website;
    }

    location / {
        return 301 https://server.sapio.ovh$request_uri;
    }
}

server {
    access_log off;
    listen 443 ssl;
    server_name server.sapio.ovh;

    ssl_certificate /etc/letsencrypt/live/server.sapio.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.sapio.ovh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Block AI bots
    if ($http_user_agent ~* (Amazonbot|anthropic-ai|Applebot-Extended|AwarioRssBot|AwarioSmartBot|Bytespider|CCBot|ChatGPT-User|Claude-Web|ClaudeBot|cohere-ai|DataForSeoBot|Diffbot|FacebookBot|Google-Extended|GPTBot|ImagesiftBot|magpie-crawler|omgili|Omgilibot|peer39_crawler|PerplexityBot|YouBot)) {
        return 403;
    }

    location /fdroid/ {
        alias /var/www/fdroid/;
        autoindex off;
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://strapi;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection Upgrade;
        proxy_pass_request_headers on;
    }
}
