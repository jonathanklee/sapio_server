services:
  strapi:
    build: .
    image: sapio-server:latest
    container_name: sapio-server
    restart: unless-stopped
    env_file: .env
    # nginx terminates TLS and proxies here, so this never needs to be public.
    ports:
      - "127.0.0.1:1337:1337"
    volumes:
      - ./data/db:/srv/app/.tmp
      - ./data/uploads:/srv/app/public/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:1337/_health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
